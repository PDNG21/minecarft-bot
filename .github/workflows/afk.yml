name: Run AFK Bot 24/7

on:
  schedule:
    - cron: '0 */5 * * *' # Tự chạy lại mỗi 5 tiếng
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
      - run: node index.js
